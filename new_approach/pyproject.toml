[project]
name = "gesture-training"
version = "0.1.0"
description = "MediaPipe landmark extraction and Random Forest training pipeline for tiny HaGRID hand gestures."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "joblib>=1.4",
  "matplotlib>=3.8",
  "mediapipe>=0.10.14",
  "numpy>=1.26,<2.2",
  "opencv-python>=4.9",
  "pandas>=2.2",
  "rich>=13.7",
  "scikit-learn>=1.4",
  "seaborn>=0.13",
  "typer>=0.12",
]

[project.scripts]
gesture-pipeline = "gesture_training.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gesture_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
